<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="main-content">
        <h1>Detalhes do Produto</h1>
        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
            <p><strong>ID:</strong> <span th:text="${produto.id}"></span></p>
            <p><strong>Nome:</strong> <span th:text="${produto.nome}"></span></p>
            <p><strong>Quantidade em Estoque:</strong> <span th:text="${produto.quantidade}"></span></p>
            <p><strong>Preço Unitário:</strong> <span th:text="'R$ ' + ${produto.valor}"></span></p>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/produtos/listar}" class="botao" style="background-color: #666;">Voltar</a>
                
                <form th:action="@{/produtos/{id}/excluir(id=${produto.id})}" method="post" 
                      onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                    <button type="submit" class="botao" style="background-color: #d9534f;">Excluir Produto</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
