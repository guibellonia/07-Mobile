<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="main-content">
        <h1>Cadastrar Novo Produto</h1>
        <form th:action="@{/produtos/cadastrar}" th:object="${produto}" method="post">
            <div>
                <label>Nome:</label>
                <input type="text" th:field="*{nome}" required />
            </div>
            <div>
                <label>Quantidade:</label>
                <input type="number" th:field="*{quantidade}" required />
            </div>
            <div>
                <label>Preço:</label>
                <input type="number" step="0.01" th:field="*{valor}" required />
            </div>
            <button type="submit" class="botao">Salvar Produto</button>
        </form>
    </main>
</body>
</html>
